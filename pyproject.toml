[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "task-analyzer-server"
version = "0.1.0"
description = "Task Analyzer server and read-only batch productivity analysis."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "regex",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy", "setuptools", "build"]

[tool.setuptools]
package-dir = { "" = "src", task_analyzer_server = "src/task-analyzer-server/task_analyzer_server" }
py-modules = ["task_analyzer"]

[tool.setuptools.packages.find]
where = ["src/task-analyzer-server"]
include = ["task_analyzer_server*"]

[tool.setuptools.package-data]
task_analyzer_server = ["schema/*.sql"]

[tool.ruff]
line-length = 79
target-version = "py313"
extend-exclude = [".ai"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["task_analyzer", "task_analyzer_server"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/task-analyzer-server/task_analyzer_server", "src/task_analyzer.py"]
exclude = "^\\.ai/"

[tool.pytest.ini_options]
testpaths = ["tests"]
